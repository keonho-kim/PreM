# Purpose: Build and verify every self-contained date release before publishing it.
# Pattern: Native target runners upload to a draft; publish only after the entire matrix succeeds.
# Usage: Push vYYYYMMDD or dispatch with an existing date tag.
# Related: scripts/package-release.py, scripts/verify-release.py.
name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vYYYYMMDD tag
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]{8}$ ]]
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "PreM $TAG" --notes-file scripts/release-notes.md
          fi
          if test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG is already published; keeping its existing assets."
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file scripts/release-notes.md
  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - id: versions
        run: python3 scripts/ci-versions.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ steps.versions.outputs.uv }}
      - name: Build prerequisites
        run: |
          npm install --global pnpm@${{ steps.versions.outputs.pnpm }}
          rustup toolchain install ${{ steps.versions.outputs.rust }} --profile minimal --component rustfmt,clippy
          pnpm install --frozen-lockfile
      - name: Install target runtimes and OCR models
        run: |
          pnpm runtime:install
          node scripts/install-release-fonts.mjs
      - name: Build and test
        run: |
          pnpm check:versions "${{ needs.prepare.outputs.tag }}"
          pnpm check:core
          pnpm build
          python3 scripts/smoke_test.py "$PWD/target/release/PreM"
      - name: Rust dependency and license policies
        if: matrix.platform == 'linux-amd64'
        run: node scripts/rust-policy.mjs install
      - name: Package and verify relocated bundle
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 scripts/package-release.py "$TAG"
          python3 scripts/verify-release.py "release/PreM-$TAG-${{ matrix.platform }}.tar.gz"
      - name: Verify minimal Linux without network or installed tools
        if: runner.os == 'Linux'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: bash scripts/verify-release-linux.sh "release/PreM-$TAG-${{ matrix.platform }}.tar.gz"
      - name: Upload verified archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" release/*.tar.gz release/*.sha256 --clobber
  browser:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - id: versions
        run: python3 scripts/ci-versions.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: ${{ steps.versions.outputs.uv }}
      - name: Prepare app and browser tests
        run: |
          npm install --global pnpm@${{ steps.versions.outputs.pnpm }}
          rustup toolchain install ${{ steps.versions.outputs.rust }} --profile minimal
          pnpm install --frozen-lockfile
          pnpm runtime:install
          pnpm build
          mkdir -p tests/.artifacts/browser-tools
          npm install --prefix tests/.artifacts/browser-tools --no-audit --no-fund puppeteer-core@${{ steps.versions.outputs.puppeteer }}
      - name: Run all real-server journeys
        run: pnpm test:e2e
  verify-assets:
    needs: [prepare, build, browser]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm complete draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name'
          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" -eq 6
