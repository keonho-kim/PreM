[workspace]
members = ["backend"]
resolver = "3"

[workspace.package]
version = "2026.11.17"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["multipart"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
mime_guess = "2"
rust-embed = "8.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "process", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Foundational packages for the approved persistence, workflow and provider boundaries.
# Keep refinery and rusqlite on a shared native SQLite dependency.
rusqlite = { version = "=0.41.0", features = ["bundled", "backup"] }
async-sqlite = { version = "=0.7.0", default-features = false }
refinery = { version = "=0.10.0", default-features = false, features = ["rusqlite"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream", "query"] }
sha2 = "=0.11.1"
uuid = { version = "=1.29.2", features = ["v4", "serde"] }
thiserror = "=2.0.21"
tokio-util = { version = "=0.7.20", features = ["rt", "io"] }
schemars = "=1.2.3"
jsonschema = { version = "=0.61.2", default-features = false }
secrecy = "=0.10.3"
subtle = "=2.6.1"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = { version = "=0.4.3", features = ["std"] }
url = "=2.5.8"
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
eventsource-stream = "=0.2.3"
tempfile = "=3.27.0"
file-format = "=0.29.0"
hex = "=0.4.3"
lopdf = { version = "=0.47.0", default-features = false }
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "=0.42.0"
html5ever = "=0.40.1"
comrak = { version = "=0.59.0", default-features = false }
cfb = "=0.16.0"
cap-std = "=4.0.3"
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
percent-encoding = "=2.3.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
